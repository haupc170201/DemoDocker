name: Build and Deploy C# API

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: [self-hosted, ubuntu-vm]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Stop and remove old container
        run: |
          docker stop my-api-container || true
          docker rm my-api-container || true

      - name: Build the Docker image
        working-directory: ./DemoVectorSearchWithOllama
        run: docker build . --file Dockerfile --tag demovectorsearchwithollama:latest

      - name: Run new container
        run: |
          docker run -d \
            --name my-api-container \
            --restart unless-stopped \
            -p 8080:8080 \
            demovectorsearchwithollama:latest

      - name: Clean up old images
        run: docker image prune -f
